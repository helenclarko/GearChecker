services:
  gearchecker:
    image: gearchecker:latest
    pull_policy: build
    build:
      context: https://github.com/helenclarko/GearChecker.git
      dockerfile: Dockerfile
    container_name: gearchecker
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      - ./logs:/app/logs
      - ./database:/app/database
    env_file:
      - stack.env
